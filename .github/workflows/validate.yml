# ============================================================
# ObservaTI - CI Pipeline
# ============================================================
# Valida que la configuración sea correcta antes de mergear.
# Se ejecuta en cada push y PR al branch main.
# ============================================================

name: Validate ObservaTI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. Validar Docker Compose y configuración
  # ─────────────────────────────────────────────────────────
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create minimal .env for validation
        run: |
          cp .env.example .env
          # Reemplazar placeholders para que compose valide
          sed -i 's/CHANGE_ME_STRONG_PASSWORD/test123/g' .env
          sed -i 's/CHANGE_ME_SMTP_PASSWORD/test123/g' .env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Verify all referenced files exist
        run: |
          echo "Verificando archivos referenciados en docker-compose..."
          test -f grafana/grafana.ini || (echo "FALTA: grafana/grafana.ini" && exit 1)
          test -d grafana/provisioning || (echo "FALTA: grafana/provisioning/" && exit 1)
          echo "✓ Todos los archivos referenciados existen"

  # ─────────────────────────────────────────────────────────
  # 2. Validar YAML/JSON de Grafana provisioning
  # ─────────────────────────────────────────────────────────
  validate-grafana:
    name: Validate Grafana Provisioning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Validate datasources YAML
        run: yq eval '.' grafana/provisioning/datasources/datasources.yml > /dev/null

      - name: Validate dashboards provider YAML
        run: yq eval '.' grafana/provisioning/dashboards/dashboards.yml > /dev/null

      - name: Validate alerting YAMLs
        run: |
          for f in grafana/provisioning/alerting/*.yml; do
            echo "Validando: $f"
            yq eval '.' "$f" > /dev/null || exit 1
          done
          echo "✓ Todos los YAMLs de alerting son válidos"

      - name: Validate dashboard JSONs
        run: |
          find grafana/provisioning/dashboards -name "*.json" | while read f; do
            echo "Validando: $f"
            python3 -m json.tool "$f" > /dev/null || exit 1
          done
          echo "✓ Todos los JSONs de dashboards son válidos"

  # ─────────────────────────────────────────────────────────
  # 3. Validar monitors.yml de Uptime Kuma
  # ─────────────────────────────────────────────────────────
  validate-monitors:
    name: Validate Monitors Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.1/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Validate monitors.yml syntax
        run: yq eval '.' uptime-kuma/monitors.yml > /dev/null

      - name: Validate monitors have required fields
        run: |
          ERRORS=0
          COUNT=$(yq '.monitors | length' uptime-kuma/monitors.yml)
          echo "Verificando $COUNT monitores..."

          for i in $(seq 0 $((COUNT - 1))); do
            NAME=$(yq ".monitors[$i].name" uptime-kuma/monitors.yml)
            URL=$(yq ".monitors[$i].url" uptime-kuma/monitors.yml)
            TYPE=$(yq ".monitors[$i].type" uptime-kuma/monitors.yml)

            if [ "$NAME" = "null" ] || [ -z "$NAME" ]; then
              echo "✗ Monitor $i: falta 'name'"
              ERRORS=$((ERRORS + 1))
            fi
            if [ "$URL" = "null" ] || [ -z "$URL" ]; then
              echo "✗ Monitor $i ($NAME): falta 'url'"
              ERRORS=$((ERRORS + 1))
            fi
            if [ "$TYPE" = "null" ] || [ -z "$TYPE" ]; then
              echo "✗ Monitor $i ($NAME): falta 'type'"
              ERRORS=$((ERRORS + 1))
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "✗ $ERRORS errores encontrados"
            exit 1
          fi
          echo "✓ Todos los monitores tienen campos requeridos"

  # ─────────────────────────────────────────────────────────
  # 4. Validar Terraform (sin credenciales)
  # ─────────────────────────────────────────────────────────
  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

  # ─────────────────────────────────────────────────────────
  # 4b. Terraform Plan (solo en PRs a main, requiere AWS creds)
  # ─────────────────────────────────────────────────────────
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [validate-terraform]
    if: github.event_name == 'pull_request'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Check AWS credentials are configured
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "⚠️ AWS credentials not configured in GitHub Secrets."
            echo "   Skipping terraform plan. Solo se ejecutó validate."
            echo "   Para habilitar plan, configura AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY en:"
            echo "   Settings → Secrets and variables → Actions → New repository secret"
            exit 0
          fi
          echo "✓ AWS credentials found"

      - name: Terraform Init
        if: env.AWS_ACCESS_KEY_ID != ''
        working-directory: terraform
        run: terraform init -backend=false

      - name: Create tfvars for plan
        if: env.AWS_ACCESS_KEY_ID != ''
        working-directory: terraform
        run: |
          cat > terraform.tfvars << 'EOF'
          project_name        = "observati"
          environment         = "development"
          aws_region          = "us-east-1"
          vpc_id              = "vpc-placeholder"
          subnet_id           = "subnet-placeholder"
          instance_type       = "t3.small"
          volume_size         = 30
          associate_public_ip = false
          allowed_cidr_blocks = ["10.0.0.0/8"]
          EOF

      - name: Terraform Plan
        if: env.AWS_ACCESS_KEY_ID != ''
        working-directory: terraform
        id: plan
        run: terraform plan -no-color -input=false 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post plan to PR comment
        if: env.AWS_ACCESS_KEY_ID != '' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planPath = 'terraform/plan_output.txt';
            let plan = '';
            if (fs.existsSync(planPath)) {
              plan = fs.readFileSync(planPath, 'utf8');
            }

            // Truncar si es muy largo
            const maxLength = 60000;
            if (plan.length > maxLength) {
              plan = plan.substring(0, maxLength) + '\n\n... (truncado)';
            }

            const output = `## Terraform Plan 📋

            \`\`\`hcl
            ${plan}
            \`\`\`

            *Plan generado automáticamente. Esto NO despliega nada.*
            *Para aplicar cambios en producción: merge a main + aprobación manual.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail if plan errored
        if: env.AWS_ACCESS_KEY_ID != '' && steps.plan.outcome == 'failure'
        run: exit 1

  # ─────────────────────────────────────────────────────────
  # 5. Test: levantar stack y verificar que Grafana arranca
  # ─────────────────────────────────────────────────────────
  integration-test:
    name: Integration Test (Grafana Starts)
    runs-on: ubuntu-latest
    needs: [validate-compose, validate-grafana]
    steps:
      - uses: actions/checkout@v4

      - name: Create test .env
        run: |
          cat > .env << 'EOF'
          GF_ADMIN_USER=admin
          GF_ADMIN_PASSWORD=testpass123
          GF_SERVER_ROOT_URL=http://localhost:3000
          GF_SERVER_DOMAIN=localhost
          AWS_ACCESS_KEY_ID=
          AWS_SECRET_ACCESS_KEY=
          AWS_DEFAULT_REGION=us-east-1
          GF_SMTP_HOST=smtp.example.com:587
          GF_SMTP_USER=test@example.com
          GF_SMTP_PASSWORD=testpass
          GF_SMTP_FROM_ADDRESS=test@example.com
          GF_SMTP_FROM_NAME=ObservaTI
          DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/test/test
          GF_ALERT_EMAIL_ADDRESSES=test@example.com
          UPTIME_KUMA_PORT=3001
          TZ=America/Guatemala
          EOF

      - name: Start services
        run: docker compose up -d

      - name: Wait for Grafana to be healthy
        run: |
          echo "Esperando que Grafana inicie..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✓ Grafana está UP (intento $i)"
              exit 0
            fi
            sleep 2
          done
          echo "✗ Grafana no respondió después de 60 segundos"
          docker compose logs grafana
          exit 1

      - name: Verify Grafana datasources loaded
        run: |
          RESPONSE=$(curl -sf -u admin:testpass123 http://localhost:3000/api/datasources)
          COUNT=$(echo "$RESPONSE" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "Datasources cargados: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "✗ No se cargaron datasources"
            exit 1
          fi
          echo "✓ Datasources OK"

      - name: Verify Grafana dashboards loaded
        run: |
          RESPONSE=$(curl -sf -u admin:testpass123 http://localhost:3000/api/search?type=dash-db)
          COUNT=$(echo "$RESPONSE" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "Dashboards cargados: $COUNT"
          if [ "$COUNT" -lt 4 ]; then
            echo "✗ Se esperaban al menos 4 dashboards, se encontraron $COUNT"
            exit 1
          fi
          echo "✓ Dashboards OK ($COUNT cargados)"

      - name: Verify Uptime Kuma is healthy
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3001 > /dev/null 2>&1; then
              echo "✓ Uptime Kuma está UP"
              exit 0
            fi
            sleep 2
          done
          echo "✗ Uptime Kuma no respondió"
          exit 1

      - name: Verify alert rules loaded
        run: |
          RESPONSE=$(curl -sf -u admin:testpass123 http://localhost:3000/api/v1/provisioning/alert-rules)
          COUNT=$(echo "$RESPONSE" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          echo "Alert rules cargadas: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "✗ No se cargaron alert rules"
            exit 1
          fi
          echo "✓ Alert rules OK ($COUNT cargadas)"

      - name: Cleanup
        if: always()
        run: docker compose down -v

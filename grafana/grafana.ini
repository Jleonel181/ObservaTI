# ============================================================
# ObservaTI - Grafana Configuration
# ============================================================
# Valores sensibles se inyectan vía variables de entorno.
# Este archivo contiene configuración estructural.
# ============================================================

[server]
protocol = http
http_port = 3000
enforce_domain = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[security]
disable_initial_admin_creation = false
cookie_secure = false
cookie_samesite = lax
# En producción con TLS, cambiar a:
# cookie_secure = true
# cookie_samesite = strict

[users]
allow_sign_up = false
allow_org_create = false
default_theme = dark

[auth]
disable_login_form = false
login_maximum_inactive_lifetime_duration = 7d
login_maximum_lifetime_duration = 30d

[auth.anonymous]
enabled = false

[smtp]
enabled = true
starttls_policy = MandatoryStartTLS

[alerting]
enabled = true
execute_alerts = true
max_attempts = 3

[unified_alerting]
enabled = true
min_interval = 10s

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/overview/application-health.json

[log]
mode = console
level = info

[log.console]
format = json

[dataproxy]
timeout = 60

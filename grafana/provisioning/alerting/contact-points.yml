# ============================================================
# ObservaTI - Contact Points (Canales de Notificación)
# ============================================================
# Discord: canal primario de alertas.
# Email (Zoho Mail): canal secundario.
# ============================================================

apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord-alerts
    receivers:
      - uid: discord-webhook
        type: discord
        settings:
          url: ${DISCORD_WEBHOOK_URL}
          use_discord_username: true
          message: |
            **{{ .Status | toUpper }}** {{ if eq .Status "firing" }}🔴{{ else }}🟢{{ end }}

            **Alerta:** {{ .CommonLabels.alertname }}
            **Severidad:** {{ .CommonLabels.severity }}
            **Ambiente:** {{ .CommonLabels.environment | default "production" }}

            {{ range .Alerts }}
            > **{{ .Labels.alertname }}**
            > Servicio: {{ .Labels.service_name | default "N/A" }}
            > Región: {{ .Labels.region | default "us-east-1" }}
            > Detalle: {{ .Annotations.description }}
            > Inicio: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
            {{ if .EndsAt }}> Fin: {{ .EndsAt.Format "2006-01-02 15:04:05" }}{{ end }}
            {{ end }}
        disableResolveMessage: false

  - orgId: 1
    name: email-alerts
    receivers:
      - uid: zoho-email
        type: email
        settings:
          addresses: ${GF_SMTP_FROM_ADDRESS}
          singleEmail: true
          message: |
            Alerta: {{ .CommonLabels.alertname }}
            Severidad: {{ .CommonLabels.severity }}
            Estado: {{ .Status }}

            {{ range .Alerts }}
            - {{ .Labels.alertname }}: {{ .Annotations.description }}
              Inicio: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
            {{ end }}
        disableResolveMessage: false

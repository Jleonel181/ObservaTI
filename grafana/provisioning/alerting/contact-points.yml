# ============================================================
# ObservaTI - Contact Points (Canales de Notificación)
# ============================================================
# Discord y Email configurados como código.
#
# IMPORTANTE: Grafana provisioning NO interpola env vars en
# secureSettings. Los valores se pasan vía environment del
# container usando la sintaxis $__env{VARIABLE}.
# ============================================================

apiVersion: 1

contactPoints:
  - orgId: 1
    name: discord-alerts
    receivers:
      - uid: discord-webhook
        type: discord
        settings:
          url: $__env{DISCORD_WEBHOOK_URL}
          use_discord_username: true
          avatar_url: ""
          message: |
            **{{ .Status | toUpper }}** {{ if eq .Status "firing" }}🔴{{ else }}🟢{{ end }}

            **Alerta:** {{ .CommonLabels.alertname }}
            **Severidad:** {{ .CommonLabels.severity }}
            **Ambiente:** {{ .CommonLabels.environment }}

            {{ range .Alerts }}
            > **{{ .Labels.alertname }}**
            > Servicio: {{ .Labels.service_name }}
            > Detalle: {{ .Annotations.description }}
            > Inicio: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
            {{ end }}
        disableResolveMessage: false

  - orgId: 1
    name: email-alerts
    receivers:
      - uid: zoho-email
        type: email
        settings:
          addresses: $__env{GF_ALERT_EMAIL_ADDRESSES}
          singleEmail: true
        disableResolveMessage: false

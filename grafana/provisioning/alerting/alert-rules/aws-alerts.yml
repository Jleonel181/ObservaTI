      # --- Lambda: Throttles ---
      - uid: lambda-throttles
        title: "Lambda Throttled"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: cloudwatch-main
            model:
              dimensions: {}
              metricName: Throttles
              namespace: AWS/Lambda
              period: "300"
              queryMode: Metrics
              refId: A
              region: default
              statistic: Sum
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          description: "Funciones Lambda están siendo throttled. Se está alcanzando el límite de concurrencia."
          summary: "Lambda throttled"
        labels:
          severity: warning
          service_name: lambda
          environment: production

  - orgId: 1
    name: AWS API Gateway
    folder: AWS Infrastructure

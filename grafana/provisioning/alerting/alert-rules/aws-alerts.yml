      - uid: apigw-5xx-errors
        title: "API Gateway 5XX Errors"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: cloudwatch-main
            model:
              dimensions: {}
              metricName: 5XXError
              namespace: AWS/ApiGateway
              period: "300"
              queryMode: Metrics
              refId: A
              region: default
              statistic: Sum
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 10
                    type: gt
              expression: B
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 3m
        annotations:
          description: "API Gateway reportando más de 10 errores 5XX. El backend tiene problemas."
          summary: "API Gateway errores 5XX"
        labels:

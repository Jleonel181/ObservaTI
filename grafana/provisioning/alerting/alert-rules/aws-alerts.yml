      - uid: lambda-errors-warning
        title: "Lambda Errors Detected"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: cloudwatch-main
            model:
              dimensions: {}
              metricName: Errors
              namespace: AWS/Lambda
              period: "300"
              queryMode: Metrics
              refId: A
              region: default
              statistic: Sum
          - refId: B
            datasourceUid: __expr__
            model:
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
              expression: B
              refId: C

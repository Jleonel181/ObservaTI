# ============================================================
# ObservaTI - Notification Policies (Routing de Alertas)
# ============================================================
# CRITICAL → Discord + Email
# WARNING  → Discord
# INFO     → Discord (baja frecuencia)
# ============================================================

apiVersion: 1

policies:
  - orgId: 1
    receiver: discord-alerts
    group_by:
      - alertname
      - service_name
      - environment
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: email-alerts
        matchers:
          - severity = critical
        group_wait: 10s
        group_interval: 3m
        repeat_interval: 2h
        continue: true

